{% extends "dashboard/base.html" %}
{% block title %}Site Configuration{% endblock %}
{% block page_title %}Site Configuration{% endblock %}
{% block content %}

<div class="form-card">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label for="site_name" class="form-label">Site Name</label>
      <input type="text" name="site_name" id="site_name" class="form-control" value="{{ config.site_name }}">
    </div>
    <div class="mb-3">
      <label for="whatsapp_number" class="form-label">WhatsApp Number</label>
      <input type="text" name="whatsapp_number" id="whatsapp_number" class="form-control" value="{{ config.whatsapp_number }}">
      <div class="form-text">International format e.g. +254700000000</div>
    </div>
    <div class="mb-3">
      <label for="phone_number" class="form-label">Phone Number</label>
      <input type="text" name="phone_number" id="phone_number" class="form-control" value="{{ config.phone_number|default:'' }}">
    </div>
    <div class="mb-3">
      <label for="support_email" class="form-label">Support Email</label>
      <input type="email" name="support_email" id="support_email" class="form-control" value="{{ config.support_email }}">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Save Configuration</button>
      <a href="{% url 'dashboard:home' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
